name: Build Metacore Observatory

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/profile-summary.yml"
      - "scripts/generate-observatory.mjs"
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

concurrency:
  group: metacore-observatory
  cancel-in-progress: true

jobs:
  build:
    name: Synchronize public engineering signal
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out the profile repository
        uses: actions/checkout@v4

      - name: Generate the animated observatory
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_LOGIN: ${{ github.repository_owner }}
        run: node scripts/generate-observatory.mjs

      - name: Publish refreshed observatory
        run: |
          git config user.name "metacore-observatory[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/metacore-observatory.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh engineering observatory"
          git push
