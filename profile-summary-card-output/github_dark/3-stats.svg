<svg xmlns="http://www.w3.org/2000/svg" width="440" height="220" viewBox="0 0 440 220" role="img" aria-labelledby="title desc">
  <title id="title">GitHub statistics awaiting first sync</title>
  <desc id="desc">Animated placeholder until live Metacore Stack statistics are generated.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071827"/><stop offset="1" stop-color="#11102a"/></linearGradient>
    <linearGradient id="a"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
  </defs>
  <rect x="1" y="1" width="438" height="218" rx="16" fill="url(#g)" stroke="#30363d" stroke-width="2"/>
  <text x="28" y="40" fill="#7dd3fc" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700" letter-spacing="2">SIGNAL 01</text>
  <text x="28" y="70" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="21" font-weight="700">Stats Matrix</text>
  <g transform="translate(28 102)">
    <rect width="36" height="53" rx="6" fill="#38bdf8" opacity=".28"><animate attributeName="height" values="28;53;28" dur="2.4s" repeatCount="indefinite"/></rect>
    <rect x="50" width="36" height="53" rx="6" fill="#8b5cf6" opacity=".34"><animate attributeName="height" values="53;22;53" dur="2.8s" repeatCount="indefinite"/></rect>
    <rect x="100" width="36" height="53" rx="6" fill="#34d399" opacity=".3"><animate attributeName="height" values="34;53;34" dur="2.1s" repeatCount="indefinite"/></rect>
  </g>
  <circle cx="377" cy="112" r="34" fill="none" stroke="#38bdf8" stroke-opacity=".22" stroke-width="8"/>
  <path d="M377 78a34 34 0 0 1 30 18" fill="none" stroke="url(#a)" stroke-width="8" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="0 377 112" to="360 377 112" dur="3.5s" repeatCount="indefinite"/></path>
  <text x="28" y="190" fill="#94a3b8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">AWAITING FIRST WORKFLOW SYNC</text>
</svg>
