  <rect x="1" y="1" width="438" height="218" rx="16" fill="url(#g)" stroke="#30363d" stroke-width="2"/>
  <text x="28" y="40" fill="#6ee7b7" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700" letter-spacing="2">SIGNAL 02</text>
  <text x="28" y="70" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="21" font-weight="700">Repository Languages</text>
